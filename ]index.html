.menu-top{background:var(--wine);color:var(--paper);padding:4rem 0 3.3rem}.menu-top h1{font-size:clamp(2.8rem,6vw,5.2rem);margin-bottom:.65rem}.menu-top p{color:#e8d9d3;max-width:520px;margin:0}.menu-controls{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;padding:1.6rem 0}.field,.select{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:2px;padding:.8rem .9rem;min-height:46px}.search-field{flex:1;min-width:180px}.filter-check{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.9rem}.category-tabs{display:flex;gap:.55rem;overflow:auto;padding:0 0 1.3rem}.category-tab{border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--muted);padding:.55rem 1rem;white-space:nowrap}.category-tab[aria-pressed="true"]{background:var(--wine);color:white;border-color:var(--wine)}
.menu-layout{display:grid;grid-template-columns:1fr;gap:2rem}.results-count{font-size:.85rem;color:var(--muted);margin-bottom:1rem}
.page-title{padding:4rem 0 2rem}.page-title h1{font-size:clamp(2.7rem,6vw,4.8rem);margin:.3rem 0 1rem}.page-title p{color:var(--muted);max-width:560px}
.cart-layout{display:grid;grid-template-columns:1.4fr .75fr;gap:2rem;align-items:start;padding-bottom:5rem}.cart-list{background:var(--paper);border:1px solid var(--line)}.cart-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:1.2rem;padding:1.25rem;border-bottom:1px solid var(--line)}.cart-row:last-child{border-bottom:0}.cart-row h3{font-size:1.15rem;margin:0 0 .25rem}.cart-row p{font-size:.85rem;color:var(--muted);margin:0}.quantity{display:flex;align-items:center;border:1px solid var(--line)}.quantity button{width:36px;height:36px;border:0;background:transparent;color:var(--wine);font-weight:700}.quantity span{min-width:24px;text-align:center}.cart-summary{background:var(--wine);color:var(--paper);padding:1.6rem;position:sticky;top:1rem}.cart-summary h2{font-size:1.8rem}.summary-line{display:flex;justify-content:space-between;padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.18)}.summary-total{font-size:1.2rem;font-weight:700;border:0;padding:1.1rem 0}.cart-summary .button{width:100%;margin-top:.7rem}
.checkout-layout{display:grid;grid-template-columns:1.1fr .8fr;gap:3rem;padding-bottom:6rem}.form-panel,.order-panel{background:var(--paper);padding:clamp(1.2rem,3vw,2.2rem);border:1px solid var(--line)}.form-panel h2,.order-panel h2{font-size:1.7rem;margin-bottom:1.5rem}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.form-group{display:grid;gap:.4rem;margin-bottom:1rem}.form-group.full{grid-column:1/-1}.form-group label{font-size:.83rem;font-weight:700}.form-group input,.form-group textarea{width:100%;border:1px solid var(--line);background:#fffdf8;padding:.82rem;border-radius:2px}.form-group textarea{min-height:90px;resize:vertical}.form-help{font-size:.77rem;color:var(--muted)}.error-message,.success-message{padding:.8rem 1rem;margin:.8rem 0;border-left:3px solid #a24142;background:#f9e9e5;color:#6e292c}.success-message{border-color:var(--sage);background:#edf1e8;color:#38533b}.order-panel{height:max-content}.order-summary-row{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0;border-bottom:1px solid var(--line);font-size:.9rem}.muted{color:var(--muted)}
.status-banner{background:var(--wine);color:var(--paper);padding:3rem 0}.status-banner h1{font-size:clamp(2.5rem,5vw,4.6rem);margin:.3rem 0}.status-pill{display:inline-block;padding:.35rem .7rem;border:1px solid var(--champagne);color:var(--champagne);font-size:.76rem;font-weight:700;letter-spacing:.1em}.tracking-card{max-width:740px;margin:-1.2rem auto 5rem;position:relative;background:var(--paper);padding:clamp(1.4rem,4vw,3rem);box-shadow:var(--shadow);border:1px solid var(--line)}.tracking-search{display:flex;gap:.6rem}.tracking-search input{flex:1;min-width:0;border:1px solid var(--line);padding:.9rem}.track-steps{display:grid;grid-template-columns:repeat(3,1fr);margin:2rem 0;position:relative}.track-steps:before{content:"";position:absolute;top:14px;left:8%;right:8%;height:1px;background:var(--line)}.track-step{position:relative;text-align:center;font-size:.82rem;color:var(--muted)}.step-dot{position:relative;z-index:1;margin:0 auto .55rem;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--muted)}.track-step.done{color:var(--wine);font-weight:700}.track-step.done .step-dot{background:var(--wine);border-color:var(--wine);color:white}

.about-hero{background:var(--wine);color:var(--paper);padding:clamp(4rem,10vw,9rem) 0}.about-hero h1{max-width:850px}.about-hero p{max-width:540px;color:#e6d8d4;font-size:1.05rem}.about-columns{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}.about-quote{font:500 clamp(1.5rem,3vw,2.4rem)/1.35 var(--serif);color:var(--wine);border-left:2px solid var(--champagne);padding-left:1.5rem}.sample-label{display:inline-block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.12em}
.site-footer{background:var(--wine-deep);color:#f5ecdf;padding:3.5rem 0 1.5rem}.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:3rem}.site-footer p,.site-footer a{color:#d9c8c5;font-size:.9rem}.site-footer h3{font-size:1.05rem;color:var(--champagne);font-family:var(--sans)}.footer-links{display:grid;gap:.45rem}.footer-bottom{margin-top:2.8rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.17);font-size:.78rem;color:#c8b5b2;display:flex;justify-content:space-between}
.admin-shell{min-height:100vh;background:#f3eee5}.admin-header{background:var(--wine-deep);color:var(--paper);padding:1rem clamp(1rem,4vw,3rem);display:flex;justify-content:space-between;align-items:center}.admin-brand{display:flex;align-items:center;gap:.7rem;font:600 1.3rem var(--serif)}.admin-main{max-width:1280px;margin:auto;padding:2.5rem clamp(1rem,4vw,3rem)}.admin-title{display:flex;justify-content:space-between;align-items:end;gap:1rem;margin-bottom:1.8rem}.admin-title h1{font-size:2.8rem;margin:.2rem 0}.admin-title p{color:var(--muted);margin:0}.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;margin-bottom:1.8rem}.stat-card{background:var(--paper);border:1px solid var(--line);padding:1.2rem}.stat-card span{display:block;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.09em}.stat-card strong{display:block;font:600 1.8rem var(--serif);color:var(--wine);margin-top:.55rem}.admin-columns{display:grid;grid-template-columns:.8fr 1.4fr;gap:1.2rem}.admin-panel{background:var(--paper);border:1px solid var(--line);padding:1.35rem;min-width:0}.admin-panel h2{font-size:1.55rem;margin-bottom:1rem}.queue-list{list-style:none;padding:0;margin:0}.queue-list li{padding:.85rem 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem}.queue-list li:last-child{border:0}.queue-num{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--rose);color:var(--wine);font-size:.78rem;font-weight:700}.queue-front{margin-left:auto;font-size:.7rem;color:var(--wine);font-weight:700;text-transform:uppercase}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:.86rem}th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}th,td{padding:.8rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}td{min-width:100px}.status-label{display:inline-block;padding:.27rem .5rem;font-size:.68rem;letter-spacing:.06em;font-weight:700;background:#f3e6d5;color:#825321}.status-label.preparing{background:#e7ebdc;color:#4f674b}.status-label.completed{background:#e9e4df;color:#635452}.admin-actions{display:flex;gap:.35rem;flex-wrap:wrap}.admin-login-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:2rem}.admin-login{width:min(440px,100%);background:var(--paper);padding:2.2rem;border:1px solid var(--line);box-shadow:var(--shadow)}.admin-login h1{font-size:2.7rem;margin:.5rem 0 1.8rem}.admin-login .button{width:100%;margin-top:.4rem}.admin-error{color:#8a353b;background:#f8e9e5;padding:.75rem;margin:1rem 0}
.state-panel{padding:3rem 1.4rem;text-align:center;border:1px dashed #d6c8b5;background:rgba(255,250,241,.65);color:var(--muted)}.state-panel h3{color:var(--wine);margin-bottom:.5rem}.skeleton{background:linear-gradient(90deg,#eee4d6 25%,#f7efe3 50%,#eee4d6 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;height:18px;margin:.7rem 0;border-radius:2px}.skeleton-card{height:330px;background:#eee4d6;animation:shimmer 1.4s infinite;background-size:200% 100%}@keyframes shimmer{to{background-position:-200% 0}}.reveal{animation:rise .55s both}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}.toast{position:fixed;right:1rem;bottom:1rem;z-index:30;max-width:min(420px,calc(100% - 2rem));padding:1rem 1.2rem;background:var(--wine-deep);color:white;box-shadow:var(--shadow);border-left:3px solid var(--champagne)}.hidden{display:none!important}

/* Brand values from the CraveCorner brief. */
:root{--wine:#701c32;--wine-deep:#48101f;--cream:#fff8ef;--champagne:#d4af75;--ink:#30221f;--muted:#796d67;--line:#e9ded2;--shadow:0 16px 42px rgba(72,16,31,.09)}
.dish-image img{transition:transform .35s}.dish-card:hover .dish-image img{transform:scale(1.045)}
.category-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:.9rem}
.category-card{min-height:190px;padding:1.3rem;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;transition:transform .22s,box-shadow .22s}
.category-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.category-card h3{font-size:1.6rem;margin:.4rem 0}.category-card .text-link{align-self:flex-start}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.why-card{padding:1.5rem 1.35rem;background:var(--paper);border:1px solid var(--line)}
.why-card h3{font-size:1.45rem;margin:1rem 0 .7rem}.why-card p{color:var(--muted);margin:0}
.js-reveal .reveal{opacity:0;transform:translateY(14px);animation:none}.js-reveal .reveal.is-visible{animation:rise .55s both}
.cursor-glow{position:fixed;left:0;top:0;width:170px;height:170px;border-radius:50%;pointer-events:none;z-index:3;opacity:.28;background:radial-gradient(circle,rgba(212,175,117,.34),rgba(212,175,117,0) 70%);will-change:transform}
.cart-pop{animation:cart-pop .35s ease-out}@keyframes cart-pop{50%{transform:scale(1.2)}}
.admin-toolbar{display:flex;justify-content:flex-end;gap:.65rem;flex-wrap:wrap;margin:-.6rem 0 1rem}
.order-detail-row td{background:#fbf5ec;padding:1.1rem}.order-detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.order-detail-grid h4{margin:0 0 .35rem;color:var(--wine);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}.order-detail-grid p{margin:0;font-size:.88rem}
@media(max-width:850px){.why-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.why-grid{grid-template-columns:1fr}.order-detail-grid{grid-template-columns:1fr}}

window.CC_TEMPLATES = {"home": {"title": "CraveCorner — campus comfort, beautifully served", "html": "\n  <header class=\"site-header\">\n    <a class=\"brand\" href=\"#/\" aria-label=\"CraveCorner home\"><span class=\"brand-mark\">C<\/span><span>CraveCorner<\/span><\/a>\n    <button class=\"menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"primary-nav\" aria-label=\"Open navigation\">☰<\/button>\n    <nav class=\"nav-links\" id=\"primary-nav\" aria-label=\"Main navigation\">\n      <a href=\"#/\">Home<\/a><a href=\"#/menu\">Menu<\/a><a href=\"#/tracking\">Track order<\/a><a href=\"#/about\">About<\/a>\n      <a href=\"#/cart\" class=\"cart-link\"><span class=\"cart-word\">Your bag<\/span><span class=\"cart-count\" data-cart-count>0<\/span><\/a>\n    <\/nav>\n  <\/header>\n  <main id=\"main\">\n<section class=\"hero\">\n  <div class=\"hero-copy reveal\">\n    <div class=\"eyebrow\">A good day starts at the corner<\/div>\n    <h1>Big comfort.<br><em>Little wait.<\/em><\/h1>\n    <p>Indian favourites, made fresh and passed from our kitchen in the order they arrive. Your next campus break has a table waiting.<\/p>\n    <div class=\"hero-actions\"><a class=\"button button-gold\" href=\"#/menu\">Order now <span aria-hidden=\"true\">→<\/span><\/a><a class=\"button button-outline\" href=\"#/menu\">Explore the menu<\/a><\/div>\n  <\/div>\n  <div class=\"hero-art\" role=\"img\" aria-label=\"A richly prepared Indian thali served on a ceramic plate\"><div class=\"hero-stamp\">Freshly<br>made<br>for you<\/div><\/div>\n<\/section>\n<div class=\"ticker\" aria-label=\"Made fresh, served in order\"><div class=\"ticker-track\"><span>Made fresh, served in order<\/span><span>Campus favourites, no fuss<\/span><span>Good food, good timing<\/span><\/div><\/div>\n<section class=\"section container\">\n  <div class=\"section-heading\"><div><div class=\"eyebrow\">The corner favourites<\/div><h2>Something worth<br>looking forward to.<\/h2><\/div><p>From a quick bite between classes to a proper comfort-food pause. Take a look at what’s cooking.<\/p><\/div>\n  <div class=\"dish-grid\" data-featured-menu aria-live=\"polite\"><div class=\"skeleton-card\"><\/div><div class=\"skeleton-card\"><\/div><div class=\"skeleton-card\"><\/div><\/div>\n  <div style=\"text-align:center;margin-top:2rem\"><a class=\"text-link\" href=\"#/menu\">See the whole menu →<\/a><\/div>\n<\/section>\n<section class=\"section container\">\n  <div class=\"section-heading\"><div><div class=\"eyebrow\">A little of everything<\/div><h2>Pick your kind<br>of comfort.<\/h2><\/div><p>Browse the kitchen’s current categories. The menu is live, so this list follows what’s actually available.<\/p><\/div>\n  <div class=\"category-cards\" data-home-categories aria-live=\"polite\"><div class=\"skeleton-card\"><\/div><div class=\"skeleton-card\"><\/div><div class=\"skeleton-card\"><\/div><\/div>\n<\/section>\n<section class=\"section\" style=\"background:var(--paper)\">\n  <div class=\"container story-grid\"><div class=\"story-plate\" aria-hidden=\"true\"><span class=\"plate-art\">रुचि<\/span><\/div>\n  <div class=\"story-copy\"><div class=\"eyebrow\">A simpler kind of good<\/div><h2>One kitchen.<br>One fair queue.<\/h2><p>We believe the best meal is the one you can look forward to. Every order joins a real first-in, first-out kitchen queue—so your place is clear, your updates are honest, and your food is made in turn.<\/p><a href=\"#/about\" class=\"text-link\">Get to know CraveCorner →<\/a><\/div><\/div>\n<\/section>\n<section class=\"section container\">\n  <div class=\"section-heading\"><div><div class=\"eyebrow\">Why CraveCorner<\/div><h2>Good food.<br>A fair place in line.<\/h2><\/div><p>We keep the ordering simple and the kitchen updates honest, so you can focus on the good part.<\/p><\/div>\n  <div class=\"why-grid\">\n    <article class=\"why-card\"><span class=\"eyebrow\">01 / Made fresh<\/span><h3>Comfort worth the wait<\/h3><p>Every sample dish is prepared to order in our fictional campus kitchen.<\/p><\/article>\n    <article class=\"why-card\"><span class=\"eyebrow\">02 / In order<\/span><h3>Your place stays yours<\/h3><p>Orders join a real first-in, first-out queue—no jumping ahead.<\/p><\/article>\n    <article class=\"why-card\"><span class=\"eyebrow\">03 / In the know<\/span><h3>Updates from the kitchen<\/h3><p>Track the saved order status as it moves from pending to preparing to complete.<\/p><\/article>\n  <\/div>\n<\/section>\n<section class=\"section\" style=\"background:var(--paper)\">\n  <div class=\"container\">\n    <div class=\"section-heading\"><div><div class=\"eyebrow\">A little word from the table<\/div><h2>Notes from our sample table.<\/h2><\/div><span class=\"sample-label\">Sample testimonials — illustrative only<\/span><\/div>\n    <div class=\"about-columns\">\n      <blockquote class=\"about-quote\">“I know exactly where my order is in the process. That’s one less thing to think about between classes.”<footer class=\"sample-label\" style=\"margin-top:1rem\">Sample customer quote<\/footer><\/blockquote>\n      <blockquote class=\"about-quote\">“A warm lunch and a fair queue. Small things, big difference on a long day.”<footer class=\"sample-label\" style=\"margin-top:1rem\">Sample customer quote<\/footer><\/blockquote>\n    <\/div>\n  <\/div>\n<\/section>\n<section class=\"section container\">\n  <div class=\"section-heading\"><div><div class=\"eyebrow\">Made for your day<\/div><h2>Your next good break<br>is just around the corner.<\/h2><\/div><a class=\"button\" href=\"#/menu\">Order something lovely<\/a><\/div>\n  <div class=\"dish-grid\" style=\"grid-template-columns:repeat(3,1fr)\">\n    <article class=\"dish-card\"><div class=\"dish-info\"><div class=\"eyebrow\">01 / Pick<\/div><h3>Find your favourite<\/h3><p>Browse the menu and add a little comfort to your day. Prices are in rupees, always.<\/p><\/div><\/article>\n    <article class=\"dish-card\"><div class=\"dish-info\"><div class=\"eyebrow\">02 / f=\"#/\">Home<\/a><a href=\"#/menu\">Menu<\/a><a href=\"#/tracking\">Track order<\/a><a href=\"#/about\">About<\/a>\n      <a href=\"#/cart\" class=\"cart-link\"><span class=\"cart-word\">Your bag<\/span><span class=\"cart-count\" data-cart-count>0<\/span><\/a>\n    <\/nav>\n  <\/header>\n  <main id=\"main\">\n<section class=\"status-banner\"><div class=\"container\"><div class=\"eyebrow\">The kitchen, in real time<\/div><h1>Your order, your place.<\/h1><p>We’ll show you what’s happening—not what we hope is happening.<\/p><\/div><\/section>\n<section class=\"container\">\n  <div class=\"tracking-card\">\n    <form class=\"tracking-search\" data-track-form><label class=\"sr-only\" for=\"track-number\">Order number<\/label><input id=\"track-number\" name=\"order_number\" required placeholder=\"Enter your order number\" aria-describedby=\"track-help\"><button class=\"button\" type=\"submit\">Find my order<\/button><\/form>\n    <p id=\"track-help\" class=\"form-help\" style=\"margin-top:.5rem\">Your order number is on the confirmation screen.<\/p>\n    <div data-track-result aria-live=\"polite\"><\/div>\n  <\/div>\n<\/section>\n<\/main>\n  <footer class=\"site-footer\">\n    <div class=\"container\">\n      <div class=\"footer-grid\">\n        <div><a class=\"brand\" href=\"#/\"><span class=\"brand-mark\">C<\/span><span>CraveCorner<\/span><\/a><p style=\"max-width:330px;margin-top:1rem\">A little warmth between lectures. Freshly made campus favourites, queued in the order they arrive.<\/p><\/div>\n        <div><h3>Find your favourite<\/h3><div class=\"footer-links\"><a href=\"#/menu\">Browse the menu<\/a><a href=\"#/cart\">Your bag<\/a><a href=\"#/tracking\">Track an order<\/a><\/div><\/div>\n        <div><h3>At the corner<\/h3><p>Fictional restaurant for an academic project.<br>Campus Kitchen, Sample Road, Pune<br>+91 00000 00000<br><a href=\"mailto:hello@cravecorner.example\">hello@cravecorner.example<\/a><\/p><a href=\"#/about\">A note about us →<\/a><\/div>\n      <\/div>\n      <div class=\"footer-bottom\"><span>© <span data-year><\/span> CraveCorner<\/span><span>Good food. Good timing.<\/span><\/div>\n    <\/div>\n  <\/footer>\n  "}, "about": {"title": "Our story — CraveCorner", "html": "\n  <header class=\"site-header\">\n    <a class=\"brand\" href=\"#/\" aria-label=\"CraveCorner home\"><span class=\"brand-mark\">C<\/span><span>CraveCorner<\/span><\/a>\n    <button class=\"menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"primary-nav\" aria-label=\"Open navigation\">☰<\/button>\n    <nav class=\"nav-links\" id=\"primary-nav\" aria-label=\"Main navigation\">\n      <a href=\"#/\">Home<\/a><a href=\"#/menu\">Menu<\/a><a href=\"#/tracking\">Track order<\/a><a href=\"#/about\">About<\/a>\n      <a href=\"#/cart\" class=\"cart-link\"><span class=\"cart-word\">Your bag<\/span><span class=\"cart-count\" data-cart-count>0<\/span><\/a>\n    <\/nav>\n  <\/header>\n  <main id=\"main\">\n<section class=\"about-hero\"><div class=\"container\"><div class=\"eyebrow\">A note from our corner<\/div><h1>Good food should feel like a small exhale.<\/h1><p>CraveCorner is a fictional restaurant created for an academic project. Its purpose is to show how a real ordering workflow can use a queue data structure to treat incoming orders fairly.<\/p><\/div><\/section>\n<section class=\"section container\">\n  <div class=\"about-columns\"><div><div class=\"eyebrow\">The idea<\/div><h2>Care, with a place in line.<\/h2><p class=\"muted\">Busy campus days already move fast. We wanted ordering to feel simple and the kitchen to feel fair. When your order comes in, it enters a first-in, first-out queue. Staff can see what’s next, move it into preparation, then mark it complete—one honest update at a time.<\/p><p class=\"muted\">The menu and order status you see here come from the kitchen’s order system. In this standalone file, that system runs inside your browser.<\/p><\/div><blockquote class=\"about-quote\">“A good meal is more than what’s on the plate. It’s knowing it’s being made for you.”<\/blockquote><\/div>\n<\/section>\n<section class=\"section container\"><div class=\"section-heading\"><div><div class=\"eyebrow\">The DSA behind the counter<\/div><h2>First in.<br>First out.<\/h2><\/div><\/div><div class=\"about-columns\"><div><h3>How the queue works<\/h3><p class=\"muted\">The Python backend stores active order numbers in <code>collections.deque<\/code>. Each new order is appended at the rear. Only the front order can move from PENDING to PREPARING, then from PREPARING to COMPLETED. Completion removes the front item; completed receipts remain in SQLite.<\/p><\/div><div><h3>How an order moves<\/h3><p class=\"muted\">Menu items are loaded from Flask. Checkout sends item IDs and quantities, and the server looks up the current prices, validates the order, calculates rupees from integer paise, and saves it. SQLite restores any incomplete queue items after a restart.<\/p><\/div><\/div><p class=\"form-help\" style=\"margin-top:2rem\">Technologies used: Python 3, Flask, SQLite, HTML5, CSS3, vanilla JavaScript, Fetch API, and a Python deque. The in-memory queue is designed for a single educational app process, not a distributed production system.<\/p><\/section>\n<section class=\"section\" style=\"background:var(--paper)\"><div class=\"container\"><div class=\"section-heading\"><div><div class=\"eyebrow\">The little things matter<\/div><h2>Simple by design.<\/h2><\/div><\/div><div class=\"about-columns\"><div><h3>Fair order, every time<\/h3><p class=\"muted\">Orders are handled in arrival order, so the queue tells the truth.<\/p><\/div><div><h3>Clear, useful updates<\/h3><p class=\"muted\">Pending, preparing, completed. No vague progress bars that promise what the kitchen can’t.<\/p><\/div><\/div><\/div><\/section>\n<section class=\"section container\"><div class=\"section-heading\"><div><div class=\"eyebrow\">A little word from the table<\/div><h2>Notes from our sample table.<\/h2><\/div><span class=\"sample-label\">Sample testimonials — illustrative only<\/span><\/div><div class=\"about-columns\"><blockquote class=\"about-quote\">“I know exactly where my order is in the process. That’s one less thing to think about between classes.”<footer class=\"sample-label\" style=\"margin-top:1rem\">Sample customer quote<\/footer><\/blockquote><blockquote class=\"about-quote\">“A warm lunch and a fair queue. Small things, big difference on a long day.”<footer class=\"sample-label\" style=\"margin-top:1rem\">Sample customer quote<\/footer><\/blockquote><\/div><\/section>\n<\/main>\n  <footer class=\"site-footer\">\n    <div class=\"container\">\n      <div class=\"footer-grid\">\n        <div><a class=\"brand\" href=\"#/\"><span class=\"brand-mark\">C<\/span><span>CraveCorner<\/span><\/a><p style=\"max-width:330px;margin-top:1rem\">A little warmth between lectures. Freshly made campus favourites, queued in the order they arrive.<\/p><\/div>\n        <div><h3>Find your favourite<\/h3><div class=\"footer-links\"><a href=\"#/menu\">Browse the menu<\/a><a href=\"#/cart\">Your bag<\/a><a href=\"#/tracking\">Track an order<\/a><\/div><\/div>\n        <div><h3>At the corner<\/h3><p>Fictional restaurant for an academic project.<br>Campus Kitchen, Sample Road, Pune<br>+91 00000 00000<br><a href=\"mailto:hello@cravecorner.example\">hello@cravecorner.example<\/a><\/p><a href=\"#/about\">A note about us →<\/a><\/div>\n      <\/div>\n      <div class=\"footer-bottom\"><span>© <span data-year><\/span> CraveCorner<\/span><span>Good food. Good timing.<\/span><\/div>\n    <\/div>\n  <\/footer>\n  "}, "admin": {"title": "Kitchen dashboard — CraveCorner", "html": "<main id=\"main\">\n<div class=\"admin-shell\">\n  <header class=\"admin-header\"><a class=\"admin-brand\" href=\"#/admin\"><span class=\"brand-mark\">C<\/span>CraveCorner <span style=\"font:500 .76rem var(--sans);color:#d9c8c5\">/ Kitchen<\/span><\/a><div style=\"display:flex;align-items:center;gap:1rem\"><span data-admin-user style=\"font-size:.85rem\"><\/span><button class=\"button button-gold button-small\" type=\"button\" data-logout>Sign out<\/button><\/div><\/header>\n  <div class=\"admin-main\" id=\"admin-main\">\n    <div class=\"admin-title\"><div><div class=\"eyebrow\">Live service<\/div><h1>Kitchen dashboard<\/h1><p>Real orders, in the order they arrived.<\/p><\/div><div style=\"font-size:.82rem;color:var(--muted)\" data-last-updated>Refreshing live…<\/div><\/div>\n    <div data-admin-error aria-live=\"assertive\"><\/div>\n     <div class=\"admin-toolbar\"><button class=\"button button-small button-outline\" type=\"button\" data-refresh-orders>Refresh orders<\/button><button class=\"button button-small\" type=\"button\" data-show-completed>View completed orders<\/button><\/div>\n    <section class=\"stat-grid\" aria-label=\"Live order statistics\" data-admin-stats><div class=\"stat-card\"><span class=\"skeleton\"><\/span><\/div><div class=\"stat-card\"><span class=\"skeleton\"><\/span><\/div><div class=\"stat-card\"><span class=\"skeleton\"><\/span><\/div><div class=\"stat-card\"><span class=\"skeleton\"><\/span><\/div><div class=\"stat-card\"><span class=\"skeleton\"><\/span><\/div><\/section>\n    <div class=\"admin-columns\">\n      <section class=\"admin-panel\"><h2>FIFO queue<\/h2><p class=\"muted\" style=\"font-size:.84rem\">First in, first out. The front order is next to move.<\/p><div data-admin-queue aria-live=\"polite\"><div class=\"skeleton\"><\/div><div class=\"skeleton\"><\/div><\/div><\/section>\n      <section class=\"admin-panel\"><h2>All orders<\/h2><div class=\"table-wrap\"><table><thead><tr><th>Order<\/th><th>Customer<\/th><th>Items<\/th><th>Total<\/th><th>Status<\/th><th>Action<\/th><\/tr><\/thead><tbody data-admin-orders><tr><td colspan=\"6\"><div class=\"skeleton\"><\/div><\/td><\/tr><\/tbody><\/table><\/div><\/section>\n    <\/div>\n  <\/div>\n<\/div>\n<\/main>"}, "admin_login": {"title": "Staff sign in — CraveCorner", "html": "<header class=\"admin-header\"><a class=\"admin-brand\" href=\"#/\"><span class=\"brand-mark\">C<\/span>CraveCorner <span style=\"font:500 .76rem var(--sans);color:#d9c8c5\">/ Staff<\/span><\/a><a href=\"#/\" style=\"font-size:.85rem;color:#eadbb7\">Back to customer site<\/a><\/header><main id=\"main\">\n<div class=\"admin-login-wrap\"><form class=\"admin-login\" data-admin-login novalidate><div class=\"eyebrow\">Staff access<\/div><h1>Welcome back.<\/h1><p class=\"muted\">Sign in to see the live kitchen queue and administer orders.<\/p><div data-login-message aria-live=\"assertive\"><\/div><div class=\"form-group\"><label for=\"username\">Username<\/label><input id=\"username\" name=\"username\" autocomplete=\"username\" required maxlength=\"80\"><\/div><div class=\"form-group\"><label for=\"password\">Password<\/label><input id=\"password\" name=\"password\" type=\"password\" autocomplete=\"current-password\" required maxlength=\"200\"><\/div><button class=\"button\" type=\"submit\" data-login-submit>Sign in to the kitchen<\/button><p class=\"form-help\" style=\"margin-top:1rem\">Demo sign-in: username <strong>admin<\/strong> · password <strong>admin@12345<\/strong><\/p><\/form><\/div>\n<\/main>"}};
</script>
<script>

(() => {
  "use strict";
  const K = { orders: "cravecorner_orders_v1", session: "cravecorner_admin_session_v1" };
  const ADMIN = { username: "admin", password: "admin@12345" };
  const MENU = [{"id": 1, "name": "Corner Classic Burger", "description": "Smash patty, aged cheddar, pickles and house sauce.", "category": "Burgers", "price_paise": 34900, "image_path": "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=85", "is_vegetarian": false}, {"id": 2, "name": "Smoky BBQ Burger", "description": "Charred onion, smoked barbecue glaze and crisp lettuce.", "category": "Burgers", "price_paise": 38900, "image_path": "https://images.unsplash.com/photo-1553979459-d2229ba7433a?auto=format&fit=crop&w=900&q=85", "is_vegetarian": false}, {"id": 3, "name": "Garden Crunch Burger", "description": "Herbed potato patty, tomato, lettuce and mint mayo.", "category": "Burgers", "price_paise": 29900, "image_path": "https://images.unsplash.com/photo-1520072959219-c595dc870360?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 4, "name": "Margherita Garden Pizza", "description": "Basil, mozzarella and bright tomato on a crisp crust.", "category": "Pizza", "price_paise": 32900, "image_path": "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 5, "name": "Roasted Pepper Pizza", "description": "Roasted peppers, olives, onion and mozzarella.", "category": "Pizza", "price_paise": 38900, "image_path": "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 6, "name": "Farmhouse Feast Pizza", "description": "A generous mix of mushrooms, peppers and sweet corn.", "category": "Pizza", "price_paise": 42900, "image_path": "https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 7, "name": "Creamy Truffle Alfredo", "description": "Silky parmesan cream, cracked pepper and herbs.", "category": "Pasta", "price_paise": 36900, "image_path": "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 8, "name": "Spicy Arrabbiata", "description": "Slow-simmered tomato, garlic, chilli and basil.", "category": "Pasta", "price_paise": 31900, "image_path": "https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 9, "name": "Roasted Tomato Penne", "description": "Penne tossed with roast tomatoes and parmesan.", "category": "Pasta", "price_paise": 33900, "image_path": "https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 10, "name": "Chicken Pesto Melt", "description": "Grilled chicken, basil pesto and melted cheese.", "category": "Sandwiches", "price_paise": 32900, "image_path": "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=900&q=85", "is_vegetarian": false}, {"id": 11, "name": "Crispy Paneer Club", "description": "Golden paneer, crunchy slaw and coriander chutney.", "category": "Sandwiches", "price_paise": 28900, "image_path": "https://images.unsplash.com/photo-1553909489-cd47e0ef937f?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 12, "name": "Golden Parmesan Fries", "description": "Crisp-cut potatoes, parmesan and garden herbs.", "category": "Starters", "price_paise": 18900, "image_path": "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 13, "name": "Crispy Chicken Bites", "description": "Buttermilk-marinated bites with smoky dip.", "category": "Starters", "price_paise": 26900, "image_path": "https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=900&q=85", "is_vegetarian": false}, {"id": 14, "name": "Chilli Garlic Mushrooms", "description": "Pan-seared mushrooms with garlic and fresh chilli.", "category": "Starters", "price_paise": 22900, "image_path": "https://images.unsplash.com/photo-1504544750208-dc0358e63f7f?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 15, "name": "Loaded Nachos", "description": "Corn chips, salsa, cheese and a little jalapeño.", "category": "Starters", "price_paise": 24900, "image_path": "https://images.unsplash.com/photo-1513456852971-30c0b8199d4d?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 16, "name": "Chocolate Fudge Brownie", "description": "Warm chocolate brownie with a soft-centred finish.", "category": "Desserts", "price_paise": 19900, "image_path": "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 17, "name": "Classic Tiramisu", "description": "Coffee-soaked layers with a dusting of cocoa.", "category": "Desserts", "price_paise": 23900, "image_path": "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 18, "name": "Vanilla Bean Cheesecake", "description": "Creamy baked cheesecake with a biscuit base.", "category": "Desserts", "price_paise": 22900, "image_path": "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 19, "name": "Fresh Lime Cooler", "description": "Fresh lime, mint and a sparkling finish.", "category": "Beverages", "price_paise": 12900, "image_path": "https://images.unsplash.com/photo-1513558161293-cdaf765edfd7?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 20, "name": "Mango Lassi", "description": "Chilled yoghurt blended with ripe mango.", "category": "Beverages", "price_paise": 14900, "image_path": "https://images.unsplash.com/photo-1527661591475-527312dd65f5?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}, {"id": 21, "name": "Cold Brew Coffee", "description": "Slow-steeped coffee served smooth and chilled.", "category": "Beverages", "price_paise": 16900, "image_path": "https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=900&q=85", "is_vegetarian": true}];
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } };
  const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
  const rupees = (p) => p / 100;
  const fail = (status, message) => Object.assign(new Error(message), { status, payload: { error: message } });
  const item = (m) => ({ id: m.id, name: m.name, description: m.description, category: m.category, price: rupees(m.price_paise), image_path: m.image_path, is_vegetarian: m.is_vegetarian });
  const orders = () => load(K.orders, []);
  const serialize = (o, priv) => {
    const r = { order_number: o.order_number, customer_name: o.customer_name, total_amount: rupees(o.total_paise), status: o.status, created_at: o.created_at, started_at: o.started_at, completed_at: o.completed_at,
      items: o.items.map((i) => ({ name: i.name, unit_price: rupees(i.unit_price_paise), quantity: i.quantity, line_total: rupees(i.line_total_paise) })) };
    if (priv) { r.customer_phone = o.customer_phone; r.delivery_address = o.delivery_address; }
    return r;
  };
  const session = () => load(K.session, null);
  const needAdmin = () => { if (!session()) throw fail(401, "Staff sign-in required."); };
  const queue = () => orders().filter((o) => o.status !== "COMPLETED").sort((a, b) => a.id - b.id);

  function parseOrder(p) {
    if (!p || typeof p !== "object") throw fail(400, "Send order details as a JSON object.");
    const name = typeof p.customer_name === "string" ? p.customer_name.trim() : "";
    if (name.length < 2 || name.length > 100) throw fail(400, "Enter a name between 2 and 100 characters.");
    const rawPhone = typeof p.customer_phone === "string" ? p.customer_phone.trim() : "";
    if (!/^\+?[\d\s()\-]+$/.test(rawPhone)) throw fail(400, "Enter a valid contact number.");
    const phone = rawPhone.replace(/[\s()\-]/g, "");
    const digits = phone.startsWith("+") ? phone.slice(1) : phone;
    if (!/^\d+$/.test(digits) || digits.length < 10 || digits.length > 15) throw fail(400, "Enter a contact number with 10 to 15 digits.");
    const address = (p.delivery_address == null ? "" : String(p.delivery_address)).trim();
    if (address.length > 500) throw fail(400, "Delivery address must be 500 characters or fewer.");
    if (!Array.isArray(p.items) || !p.items.length) throw fail(400, "Your cart is empty. Add an item before placing an order.");
    if (p.items.length > 50) throw fail(400, "An order can contain at most 50 distinct menu items.");
    const items = new Map();
    for (const it of p.items) {
      if (!it || typeof it !== "object") throw fail(400, "Each order item must include an item ID and quantity.");
      if (!Number.isInteger(it.menu_item_id) || it.menu_item_id < 1) throw fail(400, "A menu item ID is invalid.");
      if (!Number.isInteger(it.quantity)) throw fail(400, "Item quantities must be whole numbers.");
      if (it.quantity < 1 || it.quantity > 50) throw fail(400, "Each item quantity must be between 1 and 50.");
      const total = (items.get(it.menu_item_id) || 0) + it.quantity;
      if (total > 50) throw fail(400, "An item quantity cannot exceed 50.");
      items.set(it.menu_item_id, total);
    }
    return { name, phone, address: address || null, items };
  }

  function transition(number, action) {
    needAdmin();
    const all = orders();
    const o = all.find((x) => x.order_number === number);
    if (!o) throw fail(404, "That order could not be found.");
    const q = queue();
    if (!q.length) throw fail(409, "The active order queue is empty.");
    if (q[0].order_number !== number) throw fail(409, `FIFO order violation: ${q[0].order_number} must be processed first.`);
    const now = new Date().toISOString();
    if (action === "start") {
      if (o.status !== "PENDING") throw fail(409, "Only a pending front order can be started.");
      o.status = "PREPARING"; o.started_at = now;
    } else {
      if (o.status !== "PREPARING") throw fail(409, "Only the preparing front order can be completed.");
      o.status = "COMPLETED"; o.completed_at = now;
    }
    save(K.orders, all);
    return serialize(o, true);
  }

  function handle(path, method, body) {
    const url = new URL(path, "http://local");
    const p = url.pathname, q = url.searchParams;
    let m;
    if (p === "/api/csrf" && method === "GET") return { csrf_token: "local-demo-token" };
    if (p === "/api/menu" && method === "GET") {
      const cat = (q.get("category") || "").trim(), search = (q.get("search") || "").trim().toLowerCase(), veg = q.get("vegetarian");
      if (search.length > 100) throw fail(400, "Search text must be 100 characters or fewer.");
      return MENU.filter((x) => (!cat || x.category === cat) && (veg !== "true" || x.is_vegetarian) && (veg !== "false" || !x.is_vegetarian)
        && (!search || x.name.toLowerCase().includes(search) || x.description.toLowerCase().includes(search))).map(item);
    }
    if ((m = p.match(/^\/api\/menu\/(\d+)$/)) && method === "GET") {
      const x = MENU.find((i) => i.id === Number(m[1]));
      if (!x) throw fail(404, "That menu item is not available.");
      return item(x);
    }
    if (p === "/api/orders" && method === "POST") {
      const { name, phone, address, items } = parseOrder(body);
      const lines = [];
      for (const [id, qty] of items) {
        const x = MENU.find((i) => i.id === id);
        if (!x) throw fail(400, "One or more selected items are no longer available.");
        lines.push({ name: x.name, unit_price_paise: x.price_paise, quantity: qty, line_total_paise: x.price_paise * qty });
      }
      const all = orders();
      const id = (all.reduce((mx, o) => Math.max(mx, o.id), 0)) + 1;
      const order = { id, order_number: `CC-${new Date().getFullYear()}-${String(id).padStart(4, "0")}`, customer_name: name, customer_phone: phone, delivery_address: address,
        total_paise: lines.reduce((s, l) => s + l.line_total_paise, 0), status: "PENDING", created_at: new Date().toISOString(), started_at: null, completed_at: null, items: lines };
      all.push(order); save(K.orders, all);
      return serialize(order, false);
    }
    if ((m = p.match(/^\/api\/orders\/([^/]+)$/)) && method === "GET") {
      const o = orders().find((x) => x.order_number === decodeURIComponent(m[1]).trim().toUpperCase());
      if (!o) throw fail(404, "We couldn't find that order. Check the ID and try again.");
      return serialize(o, false);
    }
    if (p === "/api/admin/login" && method === "POST") {
      const u = typeof body?.username === "string" ? body.username.trim() : "", pw = typeof body?.password === "string" ? body.password : "";
      if (!u || !pw) throw fail(400, "Enter your username and password.");
      if (u.toLowerCase() !== ADMIN.username || pw !== ADMIN.password) throw fail(401, "The username or password is incorrect.");
      const s = { username: ADMIN.username, csrf_token: "local-demo-token" };
      save(K.session, s); return s;
    }
    if (p === "/api/admin/logout" && method === "POST") { localStorage.removeItem(K.session); return { message: "You have been signed out." }; }
    if (p === "/api/admin/session" && method === "GET") { needAdmin(); return session(); }
    if (p === "/api/admin/orders" && method === "GET") { needAdmin(); return orders().sort((a, b) => b.id - a.id).map((o) => serialize(o, true)); }
    if (p === "/api/admin/queue" && method === "GET") {
      needAdmin();
      const active = queue(), front = active[0];
      return { active: active.map((o) => o.order_number), front: front ? front.order_number : null,
        next_action: front ? (front.status === "PENDING" ? "START_PREPARING" : "COMPLETE_ORDER") : null };
    }
    if (p === "/api/admin/stats" && method === "GET") {
      needAdmin();
      const all = orders(), n = (s) => all.filter((o) => o.status === s).length;
      return { total_orders: all.length, pending_orders: n("PENDING"), preparing_orders: n("PREPARING"), completed_orders: n("COMPLETED"),
        completed_revenue: rupees(all.filter((o) => o.status === "COMPLETED").reduce((s, o) => s + o.total_paise, 0)) };
    }
    if ((m = p.match(/^\/api\/admin\/orders\/([^/]+)\/(start|complete)$/)) && method === "POST") return transition(decodeURIComponent(m[1]).trim().toUpperCase(), m[2]);
    throw fail(404, "Not found.");
  }
  window.CCBackend = { handle };
})();

</script>
<script>
(() => {
  "use strict";
  const CART_KEY = "cravecorner_cart_v1";
  const money = (value) => new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 }).format(Number(value || 0));
  const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
  const getCart = () => {
    try {
      const parsed = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
      return Array.isArray(parsed) ? parsed.filter((row) => Number.isInteger(Number(row.id)) && Number(row.quantity) > 0) : [];
    } catch (_) { return []; }
  };
  const saveCart = (cart) => {
    const valid = cart.filter((row) => Number(row.quantity) > 0).map((row) => ({ id: Number(row.id), quantity: Math.min(50, Math.max(1, Number(row.quantity))) }));
    localStorage.setItem(CART_KEY, JSON.stringify(valid));
    updateCartBadge();
    window.dispatchEvent(new CustomEvent("cravecorner:cart", { detail: valid }));
    return valid;
  };
  const updateCartBadge = () => {
    const count = getCart().reduce((sum, row) => sum + row.quantity, 0);
    document.querySelectorAll("[data-cart-count]").forEach((el) => {
      if (el.textContent !== String(count)) {
        el.textContent = String(count);
        el.classList.remove("cart-pop");
        requestAnimationFrame(() => el.classList.add("cart-pop"));
      }
    });
  };
  let revealObserver;
  function reveal(root = document) {
    const nodes = [];
    if (root.matches?.(".reveal")) nodes.push(root);
    nodes.push(...(root.querySelectorAll?.(".reveal") || []));
    if (!nodes.length) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) {
      nodes.forEach((node) => node.classList.add("is-visible"));
      return;
    }
    if (!revealObserver) {
      revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
    }
    nodes.forEach((node) => revealObserver.observe(node));
  }
  function initCursorGlow() {
    if (!window.matchMedia("(pointer: fine)").matches || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const glow = document.createElement("div");
    glow.className = "cursor-glow";
    glow.setAttribute("aria-hidden", "true");
    document.body.append(glow);
    let frame = 0;
    window.addEventListener("pointermove", (event) => {
      if (frame) cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        glow.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0) translate(-50%, -50%)`;
        frame = 0;
      });
    }, { passive: true });
  }
  async function api(path, options = {}) {
    await Promise.resolve();
    const method = (options.method || "GET").toUpperCase();
    const body = options.body ? JSON.parse(options.body) : null;
    return window.CCBackend.handle(path, method, body);
  }
  const parseHash = () => {
    const raw = location.hash.startsWith("#/") ? location.hash.slice(1) : "/";
    const [path, qs = ""] = raw.split("?");
    return { path: path || "/", params: new URLSearchParams(qs) };
  };
  const query = () => parseHash().params;
  const setQuery = (key, value) => {
    const { path, params } = parseHash();
    if (value) params.set(key, value); else params.delete(key);
    const qs = params.toString();
    history.replaceState(null, "", `#${path}${qs ? "?" + qs : ""}`);
  };
  const go = (path, replace = false) => { if (replace) location.replace("#" + path); else location.hash = "#" + path; };
  const pageHooks = [];
  const leaveHooks = [];
  const onPage = (fn) => pageHooks.push(fn);
  const onLeave = (fn) => leaveHooks.push(fn);
  async function csrfToken() {
    const result = await api("/api/csrf");
    if (!result?.csrf_token) throw new Error("Could not establish a secure session. Please try again.");
    return result.csrf_token;
  }
  async function mutate(path, method, body, token) {
    const csrf = await csrfToken().catch((error) => {
      if (token) return token;
      throw error;
    });
    return api(path, { method, headers: { "X-CSRF-Token": csrf }, ...(body === undefined ? {} : { body: JSON.stringify(body) }) });
  }
  const showToast = (message) => {
    const toast = document.querySelector("[data-toast]");
    if (!toast) return;
    toast.textContent = message;
    toast.classList.remove("hidden");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.add("hidden"), 3200);
  };
  const fetchItemsForCart = async (cart = getCart()) => Promise.all(cart.map(async (row) => {
    try { return { ...row, item: await api(`/api/menu/${encodeURIComponent(row.id)}`) }; }
    catch (error) { return { ...row, item: null, error }; }
  }));
  const TEMPLATES = window.CC_TEMPLATES;
  const ROUTES = [
    [/^\/$/, "home", "home"], [/^\/menu$/, "menu", "menu"], [/^\/cart$/, "cart", "cart"], [/^\/checkout$/, "checkout", "checkout"],
    [/^\/tracking$/, "tracking", "tracking"], [/^\/about$/, "about", "about"], [/^\/confirmation\/([^/]+)$/, "confirmation", "confirmation"],
    [/^\/admin\/login$/, "admin_login", "admin-login"], [/^\/admin$/, "admin", "admin"]
  ];
  function render() {
    if (location.hash && !location.hash.startsWith("#/")) return;
    leaveHooks.splice(0).forEach((fn) => { try { fn(); } catch (_) {} });
    const { path } = parseHash();
    let match = null, tpl = "home", page = "home", arg = "";
    for (const [re, t, p] of ROUTES) { const m = path.match(re); if (m) { tpl = t; page = p; arg = m[1] ? decodeURIComponent(m[1]) : ""; match = m; break; } }
    if (!match) { history.replaceState(null, "", "#/"); }
    document.body.dataset.page = page;
    document.title = TEMPLATES[tpl].title;
    document.getElementById("app").innerHTML = TEMPLATES[tpl].html;
    window.scrollTo(0, 0);
    state.routeArg = arg;
    updateCartBadge();
    const year = document.querySelector("[data-year]");
    if (year) year.textContent = String(new Date().getFullYear());
    const toggle = document.querySelector(".menu-toggle");
    const nav = document.querySelector("#primary-nav");
    if (toggle && nav) toggle.addEventListener("click", () => {
      const open = nav.classList.toggle("open");
      toggle.setAttribute("aria-expanded", String(open));
      toggle.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
      toggle.textContent = open ? "×" : "☰";
    });
    reveal(document.getElementById("app"));
    pageHooks.forEach((fn) => fn());
  }
  const state = { routeArg: "" };
  document.addEventListener("DOMContentLoaded", () => {
    document.documentElement.classList.add("js-reveal");
    document.querySelector(".skip-link")?.addEventListener("click", (event) => { event.preventDefault(); const m = document.getElementById("main"); m?.setAttribute("tabindex", "-1"); m?.focus(); });
    initCursorGlow();
    window.addEventListener("hashchange", render);
    window.addEventListener("storage", (e) => { if (e.key === CART_KEY) updateCartBadge(); });
    setTimeout(render, 0);
  });
  window.CraveCorner = { query, setQuery, go, onPage, onLeave, state, money, escapeHtml, getCart, saveCart, updateCartBadge, api, csrfToken, mutate, showToast, fetchItemsForCart, reveal };
})();

<script>
(() => {
  "use strict";
  const C = window.CraveCorner;
  const e = C.escapeHtml;
  const foodImage = (item) => item.image_path ? `<img src="${e(item.image_path)}" alt="${e(item.name)}" loading="lazy" onerror="this.hidden=true">` : `<span class="image-placeholder" aria-hidden="true">${e((item.name || "C").slice(0, 1))}</span>`;
  const card = (item) => `<article class="dish-card reveal"><div class="dish-image">${foodImage(item)}</div><div class="dish-info"><div class="dish-meta"><h3>${e(item.name)}</h3><span class="price">${C.money(item.price)}</span></div><p>${e(item.description || "")}</p><div class="dish-foot"><span class="veg-tag">${item.is_vegetarian ? "Vegetarian" : e(item.category || "Made fresh")}</span><button class="button button-small" type="button" data-add-item="${e(item.id)}" aria-label="Add ${e(item.name)} to bag">Add +</button></div></div></article>`;
  const errorBlock = (message, retry) => `<div class="state-panel" role="alert"><h3>We couldn’t reach the kitchen.</h3><p>${e(message)}</p>${retry ? `<button class="button button-small" type="button" data-retry>Try again</button>` : ""}</div>`;
  function wireAddButtons(root = document) {
    root.querySelectorAll("[data-add-item]").forEach((button) => button.addEventListener("click", () => {
      const id = Number(button.dataset.addItem);
      const cart = C.getCart();
      const existing = cart.find((row) => row.id === id);
      if (existing) existing.quantity = Math.min(50, existing.quantity + 1);
      else cart.push({ id, quantity: 1 });
      C.saveCart(cart);
      C.showToast("Added to your bag.");
      button.textContent = "Added";
      setTimeout(() => { if (button.isConnected) button.textContent = "Add +"; }, 900);
    }));
  }
  async function loadFeatured() {
    const target = document.querySelector("[data-featured-menu]");
    if (!target) return;
    try {
      const items = await C.api("/api/menu");
      if (!items.length) { target.innerHTML = `<div class="state-panel" style="grid-column:1/-1"><h3>Today’s menu is taking a moment.</h3><p>There aren’t any dishes available right now. Please check back soon.</p><a class="text-link" href="#/menu">Browse the menu →</a></div>`; return; }
      target.innerHTML = items.slice(0, 3).map(card).join("");
      wireAddButtons(target);
      C.reveal(target);
    } catch (error) { target.innerHTML = errorBlock(error.message, true); target.querySelector("[data-retry]")?.addEventListener("click", loadFeatured); }
  }
  async function initHomeCategories() {
    const target = document.querySelector("[data-home-categories]");
    if (!target) return;
    try {
      const items = await C.api("/api/menu");
      const categories = [...new Set(items.map((item) => item.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      target.innerHTML = categories.length
        ? categories.map((name, index) => `<a class="category-card reveal" href="#/menu?category=${encodeURIComponent(name)}"><span class="eyebrow">${String(index + 1).padStart(2, "0")} / From the menu</span><h3>${e(name)}</h3><span class="text-link">Explore ${e(name)} →</span></a>`).join("")
        : `<div class="state-panel" style="grid-column:1/-1"><h3>No categories are available.</h3><p>Please check the menu again later.</p></div>`;
      C.reveal(target);
    } catch (error) {
      target.innerHTML = errorBlock(error.message, true);
      target.querySelector("[data-retry]")?.addEventListener("click", initHomeCategories);
    }
  }
  async function initMenu() {
    const grid = document.querySelector("[data-menu-grid]");
    if (!grid) return;
    const form = document.querySelector("[data-menu-filters]");
    const tabs = document.querySelector("[data-category-tabs]");
    const count = document.querySelector("[data-menu-count]");
    let category = C.query().get("category") || "";
    let timer;
    let allCategories = [];
    const load = async () => {
      const params = new URLSearchParams();
      if (category) params.set("category", category);
      const search = form.elements.search.value.trim();
      if (search) params.set("search", search);
      if (form.elements.vegetarian.checked) params.set("vegetarian", "true");
      grid.innerHTML = `<div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>`;
      try {
        if (!allCategories.length) {
          const allItems = await C.api("/api/menu");
          allCategories = [...new Set(allItems.map((item) => item.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        }
        const items = await C.api(`/api/menu${params.size ? `?${params.toString()}` : ""}`);
        const active = category;
        tabs.innerHTML = `<button class="category-tab" type="button" aria-pressed="${active === ""}" data-category="">Everything</button>${allCategories.map((name) => `<button class="category-tab" type="button" aria-pressed="${active === name}" data-category="${e(name)}">${e(name)}</button>`).join("")}`;
        tabs.querySelectorAll("[data-category]").forEach((button) => button.addEventListener("click", () => {
          category = button.dataset.category;
          C.setQuery("category", category);
          load();
        }));
        count.textContent = `${items.length} ${items.length === 1 ? "dish" : "dishes"}${search ? ` matching “${search}”` : ""}`;
        grid.innerHTML = items.length ? items.map(card).join("") : `<div class="state-panel" style="grid-column:1/-1"><h3>No dishes found just yet.</h3><p>Try another search or category. The kitchen will be here when you’re ready.</p><button class="button button-small" data-clear-filters type="button">Clear filters</button></div>`;
        grid.querySelector("[data-clear-filters]")?.addEventListener("click", () => { category = ""; form.reset(); load(); });
        wireAddButtons(grid);
        C.reveal(grid);
      } catch (error) { count.textContent = ""; grid.innerHTML = errorBlock(error.message, true); grid.querySelector("[data-retry]")?.addEventListener("click", load); }
    };
    form.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(load, 250); });
    form.addEventListener("change", load);
    load();
  }
  function renderCartRows(rows, target) {
    const valid = rows.filter((row) => row.item);
    if (rows.some((row) => !row.item)) C.saveCart(valid);
    if (!valid.length) {
      target.innerHTML = `<div class="state-panel"><h3>Your bag is having a quiet moment.</h3><p>There’s nothing in it yet. Let’s find something lovely.</p><a class="button" href="#/menu">Explore the menu</a></div>`;
      document.querySelector("[data-summary-count]")?.replaceChildren("0");
      document.querySelector("[data-summary-total]")?.replaceChildren(C.money(0));
      const checkout = document.querySelector("[data-checkout-link]");
      if (checkout) { checkout.setAttribute("aria-disabled", "true"); checkout.classList.add("hidden"); }
      return;
    }
    const total = valid.reduce((sum, row) => sum + Number(row.item.price) * row.quantity, 0);
    target.innerHTML = `<div class="cart-list">${valid.map((row) => `<article class="cart-row"><div><h3>${e(row.item.name)}</h3><p>${C.money(row.item.price)} each</p></div><span class="price">${C.money(Number(row.item.price) * row.quantity)}</span><div class="quantity" aria-label="Quantity for ${e(row.item.name)}"><button type="button" data-quantity="${row.id}" data-delta="-1" aria-label="Remove one ${e(row.item.name)}">−</button><span>${row.quantity}</span><button type="button" data-quantity="${row.id}" data-delta="1" aria-label="Add one ${e(row.item.name)}">+</button></div></article>`).join("")}</div>`;
    document.querySelector("[data-summary-count]")?.replaceChildren(String(valid.reduce((sum, row) => sum + row.quantity, 0)));
    document.querySelector("[data-summary-total]")?.replaceChildren(C.money(total));
    document.querySelector("[data-checkout-link]")?.classList.remove("hidden");
    target.querySelectorAll("[data-quantity]").forEach((button) => button.addEventListener("click", async () => {
      const cart = C.getCart();
      const id = Number(button.dataset.quantity);
      const row = cart.find((entry) => entry.id === id);
      if (row) row.quantity += Number(button.dataset.delta);
      C.saveCart(cart);
      const updatedRows = valid.map((entry) => ({ ...entry, quantity: cart.find((current) => current.id === entry.id)?.quantity || 0 })).filter((entry) => entry.quantity > 0);
      renderCartRows(updatedRows, target);
    }));
  }
  async function initCart() {
    const target = document.querySelector("[data-cart-list]");
    if (!target) return;
    try { renderCartRows(await C.fetchItemsForCart(), target); }
    catch (error) { target.innerHTML = errorBlock(error.message, true); target.querySelector("[data-retry]")?.addEventListener("click", initCart); }
  }
  async function initCheckout() {
    const form = document.querySelector("[data-checkout-form]");
    if (!form) return;
    const summary = document.querySelector("[data-checkout-summary]");
    let rows;
    try {
      rows = (await C.fetchItemsForCart()).filter((row) => row.item);
      if (!rows.length) {
        summary.innerHTML = `<div class="state-panel"><h3>Your bag is empty.</h3><p>Add something from the menu before checkout.</p><a class="text-link" href="#/menu">Browse the menu →</a></div>`;
        form.querySelector("[data-submit-order]").disabled = true;
        return;
      }
      C.saveCart(rows);
      summary.innerHTML = rows.map((row) => `<div class="order-summary-row"><span>${row.quantity} × ${e(row.item.name)}</span><strong>${C.money(row.item.price * row.quantity)}</strong></div>`).join("");
      const total = rows.reduce((sum, row) => sum + row.item.price * row.quantity, 0);
      document.querySelector("[data-checkout-total]").textContent = C.money(total);
    } catch (error) { summary.innerHTML = errorBlock(error.message, true); return; }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = form.querySelector("[data-form-message]");
      const submit = form.querySelector("[data-submit-order]");
      message.innerHTML = "";
      const name = form.elements.customer_name.value.trim();
      const phone = form.elements.customer_phone.value.trim();
      const address = form.elements.delivery_address.value.trim();
      if (name.length < 2 || phone.length < 10 || phone.length > 16 || !/^[+\d\s().-]+$/.test(phone)) {
        message.innerHTML = `<div class="error-message" role="alert">Please enter a name and a valid phone number (10–16 characters).</div>`;
        return;
      }
      submit.disabled = true; submit.textContent = "Sending your order…";
      try {
        const payload = { customer_name: name, customer_phone: phone, items: rows.map((row) => ({ menu_item_id: Number(row.item.id), quantity: row.quantity })) };
        if (address) payload.delivery_address = address;
        const result = await C.mutate("/api/orders", "POST", payload);
        C.saveCart([]);
        C.go(`/confirmation/${encodeURIComponent(result.order_number)}`);
      } catch (error) {
        message.innerHTML = `<div class="error-message" role="alert">${e(error.message)}</div>`;
        submit.disabled = false; submit.innerHTML = `Place my order <span aria-hidden="true">→</span>`;
      }
    });
  }
  const formatTime = (value) => value ? new Intl.DateTimeFormat("en-IN", { dateStyle: "medium", timeStyle: "short" }).format(new Date(value)) : "—";
  function renderOrder(order, result) {
    const statuses = ["PENDING", "PREPARING", "COMPLETED"];
    const state = statuses.indexOf(order.status);
    result.innerHTML = `<div style="margin-top:2rem"><div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap"><div><div class="eyebrow">Order ${e(order.order_number)}</div><h2 style="font-size:1.7rem;margin:0">${e(order.customer_name)}</h2></div><span class="status-pill">${e(order.status)}</span></div>
    <div class="track-steps" aria-label="Order progress">${["Received", "Preparing", "Ready"].map((label, index) => `<div class="track-step ${index <= state ? "done" : ""}"><div class="step-dot">${index < state ? "✓" : index + 1}</div>${label}</div>`).join("")}</div>
    <p class="muted" style="font-size:.85rem">Placed ${formatTime(order.created_at)}${order.started_at ? ` · Preparation began ${formatTime(order.started_at)}` : ""}${order.completed_at ? ` · Completed ${formatTime(order.completed_at)}` : ""}</p>
    <h3 style="font-size:1.1rem;margin:1.5rem 0 .5rem">In this order</h3>${(order.items || []).map((item) => `<div class="order-summary-row"><span>${Number(item.quantity)} × ${e(item.name)}</span><strong>${C.money(item.line_total)}</strong></div>`).join("")}<div class="summary-line summary-total"><span>Total</span><span>${C.money(order.total_amount)}</span></div></div>`;
  }
  async function initTracking() {
    const form = document.querySelector("[data-track-form]");
    const output = document.querySelector("[data-track-result]");
    if (!form || !output) return;
    let pollTimer;
    let currentOrder = "";
    C.onLeave(() => clearInterval(pollTimer));
    const lookup = async (number) => {
      currentOrder = number;
      clearInterval(pollTimer);
      output.innerHTML = `<div class="skeleton" style="margin-top:2rem"></div><div class="skeleton"></div><div class="skeleton"></div>`;
      try {
        const order = await C.api(`/api/orders/${encodeURIComponent(number)}`);
        renderOrder(order, output);
        if (order.status !== "COMPLETED") pollTimer = setInterval(async () => {
          try {
            const latest = await C.api(`/api/orders/${encodeURIComponent(currentOrder)}`);
            renderOrder(latest, output);
            if (latest.status === "COMPLETED") clearInterval(pollTimer);
          } catch (_) { /* Retain the last known real status if a refresh is interrupted. */ }
        }, 12000);
      }
      catch (error) { output.innerHTML = `<div class="error-message" role="alert">${e(error.message)} Please check the order number and try again.</div>`; }
    };
    form.addEventListener("submit", (event) => { event.preventDefault(); const value = form.elements.order_number.value.trim(); if (value) { C.setQuery("order", value); lookup(value); } });
    const queryOrder = C.query().get("order");
    if (queryOrder) { form.elements.order_number.value = queryOrder; lookup(queryOrder); }
  }
  function initConfirmation() {
    const root = document.querySelector("[data-confirmation]");
    if (!root) return;
    const pathNo = C.state.routeArg;
    const number = root.dataset.orderNumber || pathNo;
    const numberTarget = root.querySelector("[data-confirmation-number]");
    if (numberTarget) numberTarget.textContent = number;
    const trackLink = root.querySelector('a[href^="#/tracking"]');
    if (trackLink) trackLink.href = `#/tracking?order=${encodeURIComponent(number)}`;
    C.api(`/api/orders/${encodeURIComponent(number)}`).then((order) => {
      numberTarget.textContent = order.order_number;
      const summary = document.createElement("p");
      summary.className = "muted";
      summary.textContent = `${order.items?.length || 0} item types · ${C.money(order.total_amount)} · ${order.status}`;
      root.querySelector(".confirmation-box")?.append(summary);
    }).catch((error) => {
      const note = document.createElement("p"); note.className = "form-help"; note.textContent = `Order details are temporarily unavailable: ${error.message}`;
      root.querySelector(".confirmation-box")?.append(note);
    });
  }
  C.onPage(() => {
    loadFeatured(); initHomeCategories(); initMenu(); initCart(); initCheckout(); initTracking(); initConfirmation();
  });
})();

<script>
(() => {
  "use strict";
  const C = window.CraveCorner;
  const e = C.escapeHtml;
  let session = null;
  let refreshTimer = null;
  let showCompletedOnly = false;
  const formatDate = (value) => value ? new Intl.DateTimeFormat("en-IN", { dateStyle: "short", timeStyle: "short" }).format(new Date(value)) : "—";
  const errorText = (error) => e(error?.message || "The request could not be completed.");
  function displayError(target, error, retryAction) {
    if (!target) return;
    target.innerHTML = `<div class="error-message" role="alert">${errorText(error)}${retryAction ? ` <button class="button button-small" type="button" data-error-retry>Retry</button>` : ""}</div>`;
    target.querySelector("[data-error-retry]")?.addEventListener("click", retryAction);
  }
  async function initLogin() {
    const form = document.querySelector("[data-admin-login]");
    if (!form) return;
    try {
      const current = await C.api("/api/admin/session");
      if (current?.username) { session = current; C.go("/admin", true); return; }
    } catch (_) { /* unauthenticated is the normal sign-in state */ }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const target = form.querySelector("[data-login-message]");
      const button = form.querySelector("[data-login-submit]");
      target.innerHTML = "";
      if (!form.elements.username.value.trim() || !form.elements.password.value) {
        target.innerHTML = `<div class="admin-error" role="alert">Enter your username and password.</div>`;
        return;
      }
      button.disabled = true; button.textContent = "Signing in…";
      try {
        const csrf = await C.csrfToken();
        session = await C.api("/api/admin/login", { method: "POST", headers: { "X-CSRF-Token": csrf }, body: JSON.stringify({ username: form.elements.username.value.trim(), password: form.elements.password.value }) });
        if (!session?.username) throw new Error("The server did not return an authenticated staff session.");
        C.go("/admin");
      } catch (error) {
        target.innerHTML = `<div class="admin-error" role="alert">${errorText(error)}</div>`;
        button.disabled = false; button.textContent = "Sign in to the kitchen";
      }
    });
  }
  function statMarkup(stats) {
    return [
      ["All orders", stats.total_orders],
      ["Waiting", stats.pending_orders],
      ["Preparing", stats.preparing_orders],
      ["Completed", stats.completed_orders],
      ["Sales completed", C.money(stats.completed_revenue)]
    ].map(([label, value]) => `<article class="stat-card"><span>${e(label)}</span><strong>${typeof value === "number" ? e(value) : e(value)}</strong></article>`).join("");
  }
  function statusClass(status) { return String(status).toLowerCase(); }
  async function loadDashboard() {
    const statsEl = document.querySelector("[data-admin-stats]");
    const queueEl = document.querySelector("[data-admin-queue]");
    const ordersEl = document.querySelector("[data-admin-orders]");
    const errorEl = document.querySelector("[data-admin-error]");
    try {
      const [stats, queue, orders] = await Promise.all([
        C.api("/api/admin/stats"), C.api("/api/admin/queue"), C.api("/api/admin/orders")
      ]);
      errorEl.innerHTML = "";
      statsEl.innerHTML = statMarkup(stats);
      const queueIds = queue.active || [];
      const queueOrders = queueIds.map((id) => orders.find((order) => String(order.order_number) === String(id))).filter(Boolean);
      queueEl.innerHTML = queueOrders.length ? `<ol class="queue-list">${queueOrders.map((order, index) => `<li><span class="queue-num">${index + 1}</span><div><strong>${e(order.order_number)}</strong><div class="muted" style="font-size:.78rem">${e(order.customer_name)} · ${formatDate(order.created_at)}</div></div>${String(order.order_number) === String(queue.front) ? `<span class="queue-front">Next up</span>` : ""}</li>`).join("")}</ol><p class="form-help" style="margin-top:1rem">Next action: ${e(queue.next_action || "No action required")}</p>` : `<div class="state-panel"><h3>Queue is clear.</h3><p>New orders will appear here as soon as they arrive.</p></div>`;
      const visibleOrders = showCompletedOnly ? orders.filter((order) => order.status === "COMPLETED") : orders;
      ordersEl.innerHTML = visibleOrders.length ? visibleOrders.slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).map((order) => {
        const orderNumber = e(order.order_number);
        const lineItems = (order.items || []).map((item) => `${Number(item.quantity)} × ${e(item.name)} (${C.money(item.unit_price)} each)`).join("<br>");
        return `<tr>
          <td><strong>${orderNumber}</strong><div class="muted" style="font-size:.75rem">${formatDate(order.created_at)}</div></td>
          <td>${e(order.customer_name)}<div class="muted" style="font-size:.75rem">${e(order.customer_phone)}</div></td>
          <td>${(order.items || []).map((item) => `${Number(item.quantity)} × ${e(item.name)}`).join("<br>")}</td>
          <td>${C.money(order.total_amount)}</td><td><span class="status-label ${statusClass(order.status)}">${e(order.status)}</span></td>
          <td><div class="admin-actions"><button class="button button-small button-outline" type="button" data-order-view="${orderNumber}" aria-expanded="false">View details</button>${order.status === "PENDING" ? `<button class="button button-small" type="button" data-order-action="start" data-order="${orderNumber}" ${queue.front && String(order.order_number) !== String(queue.front) ? "disabled title=\"The next order must be handled first.\"" : ""}>Start</button>` : ""}${order.status === "PREPARING" ? `<button class="button button-small button-gold" type="button" data-order-action="complete" data-order="${orderNumber}">Complete</button>` : ""}${order.status === "COMPLETED" ? `<span class="muted">Done</span>` : ""}</div></td>
        </tr><tr class="order-detail-row" data-detail-row="${orderNumber}" hidden><td colspan="6"><div class="order-detail-grid">
          <div><h4>Items</h4><p>${lineItems}<br><strong>Total: ${C.money(order.total_amount)}</strong></p></div>
          <div><h4>Customer</h4><p>${e(order.customer_name)}<br>${e(order.customer_phone)}<br>${e(order.delivery_address || "No pickup or delivery note.")}</p></div>
          <div><h4>Timeline</h4><p>Received: ${formatDate(order.created_at)}<br>Preparing: ${formatDate(order.started_at)}<br>Completed: ${formatDate(order.completed_at)}</p></div>
        </div></td></tr>`;
      }).join("") : `<tr><td colspan="6"><div class="state-panel"><h3>${showCompletedOnly ? "No completed orders yet." : "No orders yet."}</h3><p>${showCompletedOnly ? "Completed orders will stay available in this history." : "Live customer orders will appear here."}</p></div></td></tr>`;
      ordersEl.querySelectorAll("[data-order-view]").forEach((button) => button.addEventListener("click", () => {
        const detail = [...ordersEl.querySelectorAll("[data-detail-row]")].find((row) => row.dataset.detailRow === button.dataset.orderView);
        if (!detail) return;
        detail.hidden = !detail.hidden;
        button.setAttribute("aria-expanded", String(!detail.hidden));
        button.textContent = detail.hidden ? "View details" : "Hide details";
      }));
      ordersEl.querySelectorAll("[data-order-action]").forEach((button) => button.addEventListener("click", () => transitionOrder(button)));
      const updated = document.querySelector("[data-last-updated]");
      if (updated) updated.textContent = `Updated ${new Intl.DateTimeFormat("en-IN", { timeStyle: "short" }).format(new Date())} · refreshes every 4 sec`;
    } catch (error) {
      displayError(errorEl, error, loadDashboard);
      if (error.status === 401 || error.status === 403) C.go("/admin/login", true);
      else {
        statsEl.innerHTML = `<div class="state-panel" style="grid-column:1/-1"><h3>Live statistics unavailable.</h3><p>${errorText(error)}</p></div>`;
        queueEl.innerHTML = `<div class="state-panel"><h3>Queue unavailable.</h3><p>${errorText(error)}</p></div>`;
        ordersEl.innerHTML = `<tr><td colspan="6"><div class="state-panel"><h3>Orders unavailable.</h3><p>${errorText(error)}</p></div></td></tr>`;
      }
    }
  }
  async function transitionOrder(button) {
    const action = button.dataset.orderAction;
    const order = button.dataset.order;
    const original = button.textContent;
    button.disabled = true; button.textContent = action === "start" ? "Starting…" : "Completing…";
    try {
      await C.mutate(`/api/admin/orders/${encodeURIComponent(order)}/${action}`, "POST", undefined, session?.csrf_token);
      await loadDashboard();
      C.showToast(action === "start" ? "Order moved to preparation." : "Order marked complete.");
    } catch (error) {
      button.disabled = false; button.textContent = original;
      displayError(document.querySelector("[data-admin-error]"), error);
    }
  }
  async function initAdmin() {
    if (!document.querySelector(".admin-shell")) return;
    try {
      session = await C.api("/api/admin/session");
      if (!session?.username) throw Object.assign(new Error("Staff session required."), { status: 401 });
      document.querySelector("[data-admin-user]").textContent = session.username;
      await loadDashboard();
      refreshTimer = setInterval(loadDashboard, 4000);
      C.onLeave(() => clearInterval(refreshTimer));
    } catch (error) {
      if (error.status === 401 || error.status === 403) C.go("/admin/login", true);
      else displayError(document.querySelector("[data-admin-error]"), error);
    }
    document.querySelector("[data-logout]")?.addEventListener("click", async (event) => {
      const button = event.currentTarget;
      button.disabled = true;
      try {
        await C.mutate("/api/admin/logout", "POST", undefined, session?.csrf_token);
        if (refreshTimer) clearInterval(refreshTimer);
        C.go("/admin/login");
      } catch (error) {
        button.disabled = false;
        displayError(document.querySelector("[data-admin-error]"), error);
      }
    });
    document.querySelector("[data-refresh-orders]")?.addEventListener("click", async (event) => {
      const button = event.currentTarget;
      button.disabled = true;
      const original = button.textContent;
      button.textContent = "Refreshing…";
      await loadDashboard();
      button.disabled = false;
      button.textContent = original;
    });
    document.querySelector("[data-show-completed]")?.addEventListener("click", async (event) => {
      showCompletedOnly = !showCompletedOnly;
      event.currentTarget.textContent = showCompletedOnly ? "Show all orders" : "View completed orders";
      await loadDashboard();
    });
  }
  C.onPage(() => { showCompletedOnly = false; initLogin(); initAdmin(); });
})();

</script>
</body>
</html>
